name: Continuous Deployment

on:
  push:
    branches: [ develop, staging, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run tests
      run: |
        pytest
    
    - name: Deploy to Development
      if: github.ref == 'refs/heads/develop'
      run: |
        echo "Desplegando a entorno de DESARROLLO"
        # Aquí irían los comandos para desplegar a desarrollo
        # Por ejemplo: deploy-to-dev-server.sh
    
    - name: Deploy to Staging
      if: github.ref == 'refs/heads/staging'
      run: |
        echo "Desplegando a entorno de STAGING"
        # Aquí irían los comandos para desplegar a staging
        # Por ejemplo: deploy-to-staging-server.sh
    
    - name: Deploy to Production
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Desplegando a entorno de PRODUCCIÓN"
        # Aquí irían los comandos para desplegar a producción
        # Por ejemplo: deploy-to-production-server.sh


    - name: Deploy to Development
      if: github.ref == 'refs/heads/develop'
      run: |
        python deploy.py DESARROLLO
    
    - name: Deploy to Staging
      if: github.ref == 'refs/heads/staging'
      run: |
        python deploy.py STAGING
    
    - name: Deploy to Production
      if: github.ref == 'refs/heads/main'
      run: |
        python deploy.py PRODUCCION